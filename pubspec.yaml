name: sustainable_living_guide
description: A comprehensive sustainable living guide application built with Flutter and Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.3.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  provider: ^6.1.1
  intl: ^0.20.2
  fl_chart: ^1.2.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.4
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  google_fonts: ^8.1.0
  uuid: ^4.3.3
  path_provider: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
